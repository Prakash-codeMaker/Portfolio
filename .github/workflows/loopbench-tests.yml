name: LoopBench tests
on:
  pull_request:
    paths:
      - "projects/loopbench-manifold/**"
      - ".github/workflows/loopbench-tests.yml"
  push:
    branches: [main]
    paths:
      - "projects/loopbench-manifold/**"
      - ".github/workflows/loopbench-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate synthetic fixture
        run: python projects/loopbench-manifold/loopbench.py validate projects/loopbench-manifold/data/synthetic_candidate_outcomes.csv
      - name: Run unit tests
        run: python -m unittest discover -s projects/loopbench-manifold/tests -v
      - name: Run holdout diagnostic
        run: python projects/loopbench-manifold/loopbench.py evaluate projects/loopbench-manifold/data/synthetic_candidate_outcomes.csv --top-k 5
